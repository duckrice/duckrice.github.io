<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tyskland">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>tyskland</title>
<style>
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    max-width: 720px;
    background: #0b0b0b;
    color: #d8d8d8;
    font: 16px/1.5 Consolas, "Courier New", monospace;
    color-scheme: dark;
  }
  a,
  .ok {
    color: #4ade80;
  }
  .drink {
    color: #f59e0b;
    text-decoration: line-through;
  }
  .muted {
    color: #8a8a8a;
  }
  input,
  button,
  label.button {
    display: inline-block;
    margin: 4px 8px 4px 0;
    padding: 8px 12px;
    border: 1px solid #333333;
    border-radius: 0;
    background: #111111;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  table {
    border-collapse: collapse;
  }
  td {
    padding: 2px 16px 2px 0;
    vertical-align: top;
  }
  td.num {
    text-align: right;
  }
  .receipt {
    margin: 16px 0;
    padding-top: 8px;
    border-top: 1px dashed #333333;
  }
  .line {
    cursor: pointer;
  }
  .hidden {
    display: none;
  }
  /* A file input hidden this way still opens on iPhone when its label is tapped. */
  label.button {
    position: relative;
    overflow: hidden;
  }
  label.button input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    font-size: 16px;
  }
  td:first-child {
    overflow-wrap: anywhere;
  }
  /* The receipt shown over the page. */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: #0b0b0b;
  }
  .viewer canvas,
  .viewer img {
    display: block;
    max-width: 100%;
    margin: 0 0 16px;
    background: #ffffff;
  }
  button.on {
    border-color: #4ade80;
    color: #4ade80;
  }
  tr.sum td {
    padding-top: 8px;
    border-top: 1px solid #333333;
  }
  #summary td {
    padding-right: 10px;
    white-space: nowrap;
    overflow-wrap: normal;
    font-size: 14px;
  }
</style>
</head>
<body>
<p>tyskland</p>

<p><button id="showReceipts" class="on">kvitteringer</button><button id="showOverview">oversikt</button></p>

<div id="receiptsView">
  <p id="who">hvem er du?<br></p>
  <p>
    <label class="button">+ kvittering (pdf)<input id="files" type="file" accept="application/pdf,.pdf" multiple></label>
    <button id="typed">+ skriv inn total</button>
  </p>
  <p id="status" class="muted"></p>
  <p id="where" class="muted"></p>
  <p id="filter" class="muted"></p>
  <div id="list"></div>
</div>

<div id="overviewView" class="hidden">
  <p class="muted">uten alkohol er det som teller. alkohol er tatt ut (pant for drikke med).</p>
  <table id="summary"></table>
  <div id="settle"></div>
</div>

<script type="module">
  import { notAnItem, parseReceipt, settle, spending } from "./receipts.js";
  import { firebaseConfig } from "./config.js";
  import { readPaper } from "./photo.js";

  const $ = (id) => document.getElementById(id);
  const kr = (n) => n.toFixed(2).replace(".", ",") + " €";
  // The four on the trip; each phone remembers who it belongs to.
  const PEOPLE = ["AA", "AR", "RJ", "FR"];
  let showOnly = "";
  let me = PEOPLE.includes(localStorage.getItem("tyskland.me")) ? localStorage.getItem("tyskland.me") : "";
  const whoButtons = PEOPLE.map((name) => {
    const b = Object.assign(document.createElement("button"), { textContent: name });
    b.addEventListener("click", () => {
      me = name;
      localStorage.setItem("tyskland.me", name);
      for (const x of whoButtons) x.classList.toggle("on", x === b);
      $("status").textContent = "";
    });
    b.classList.toggle("on", name === me);
    return b;
  });
  $("who").append(...whoButtons);

  for (const [button, view] of [["showReceipts", "receiptsView"], ["showOverview", "overviewView"]])
    $(button).addEventListener("click", () => {
      for (const id of ["receiptsView", "overviewView"]) $(id).classList.toggle("hidden", id !== view);
      for (const id of ["showReceipts", "showOverview"]) $(id).classList.toggle("on", id === button);
    });

  // The group's code comes with the shared link and is remembered, so the home-screen icon finds it.
  if (location.hash.length > 1) localStorage.setItem("tyskland.code", location.hash.slice(1));
  // Without a link, this phone starts a trip: a random code nobody can guess (the rules want 16+ characters).
  if (firebaseConfig && !localStorage.getItem("tyskland.code")) {
    const abc = "abcdefghijkmnpqrstuvwxyz23456789";
    localStorage.setItem("tyskland.code", [...crypto.getRandomValues(new Uint8Array(20))].map((b) => abc[b % abc.length]).join(""));
  }
  const tripCode = localStorage.getItem("tyskland.code") ?? "";
  // The code stays in the address, so "Add to Home Screen" keeps it.
  if (tripCode && location.hash.slice(1) !== tripCode) history.replaceState(null, "", `#${tripCode}`);

  // A receipt saved with its "Summe" read as an item: that line out. When no total had been found, the
  // total was all lines added up, "Summe" included: then the "Summe" line's amount is the real total.
  function withoutSumme(r) {
    const gone = r.items.filter((i) => notAnItem(i.name));
    if (!gone.length) return r;
    const all = r.items.reduce((s, i) => s + i.amount, 0);
    const total = Math.abs(r.total - all) <= 0.06 ? gone[gone.length - 1].amount : r.total;
    return { ...r, items: r.items.filter((i) => !notAnItem(i.name)), total };
  }

  // ---- where the receipts are kept: shared (Firebase) or on this phone -------------------------
  let receipts = [];
  let store;
  if (firebaseConfig && tripCode) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const app = initializeApp(firebaseConfig);
    // The database only answers phones signed in (no password: the page does it by itself).
    try {
      await signInAnonymously(getAuth(app));
    } catch (e) {
      $("status").textContent = `kunne ikke koble til: ${e.message}`;
    }
    const db = fs.getFirestore(app);
    const col = fs.collection(db, "trips", tripCode, "receipts");
    fs.onSnapshot(col, (snap) => {
      receipts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      // Receipts read before "Summe" was always caught: that line taken out, once, for everyone.
      for (const r of receipts) if (r.items.some((i) => notAnItem(i.name))) store.update(withoutSumme(r));
      render();
    }, (e) => ($("status").textContent = `kunne ikke hente kvitteringene: ${e.message}`));
    // The receipts' own files (the PDF or photo), in pieces under Firestore's 1 MB a document, read only when shown.
    const files = fs.collection(db, "trips", tripCode, "files");
    const PIECE = 900_000;
    store = {
      add: async (r) => (await fs.addDoc(col, r)).id,
      update: (r) => fs.setDoc(fs.doc(col, r.id), (({ id, ...rest }) => rest)(r)),
      remove: async (r) => {
        await fs.deleteDoc(fs.doc(col, r.id));
        for (let i = 0; i < (r.attachment?.parts ?? 0); i++) await fs.deleteDoc(fs.doc(files, `${r.id}-${i}`)).catch(() => {});
      },
      saveFile: async (id, bytes, type) => {
        const parts = Math.ceil(bytes.length / PIECE);
        for (let i = 0; i < parts; i++) await fs.setDoc(fs.doc(files, `${id}-${i}`), { receipt: id, i, parts, type, data: fs.Bytes.fromUint8Array(bytes.subarray(i * PIECE, (i + 1) * PIECE)) });
        await fs.updateDoc(fs.doc(col, id), { attachment: { type, parts, size: bytes.length } });
      },
      loadFile: async (id, parts) => {
        const pieces = [];
        for (let i = 0; i < parts; i++) pieces.push((await fs.getDoc(fs.doc(files, `${id}-${i}`))).data().data.toUint8Array());
        const out = new Uint8Array(pieces.reduce((s, p) => s + p.length, 0));
        let at = 0;
        for (const p of pieces) (out.set(p, at), (at += p.length));
        return out;
      },
    };
    // The link to send the group: whoever opens it sees and adds to the same receipts.
    const link = `${location.origin}${location.pathname}#${tripCode}`;
    const share = Object.assign(document.createElement("button"), { textContent: "del lenken med gruppa" });
    share.addEventListener("click", async () => {
      if (navigator.share) return navigator.share({ title: "tyskland", url: link }).catch(() => {});
      await navigator.clipboard.writeText(link);
      $("status").textContent = "lenken er kopiert. send den bare til gruppa.";
    });
    $("where").replaceChildren("delt med alle som har lenken. ", share);
  } else {
    const save = () => (localStorage.setItem("tyskland.receipts", JSON.stringify(receipts)), render());
    receipts = JSON.parse(localStorage.getItem("tyskland.receipts") ?? "[]").map(withoutSumme);
    store = {
      add: async (r) => {
        const id = crypto.randomUUID?.() ?? String(Date.now() + Math.random());
        receipts.push({ id, ...r });
        save();
        return id;
      },
      update: async (r) => (receipts = receipts.map((x) => (x.id === r.id ? r : x)), save()),
      remove: async (r) => (receipts = receipts.filter((x) => x.id !== r.id), save()),
    };
    $("where").textContent = "lagret bare på denne telefonen.";
    render();
  }

  // ---- reading a receipt: the PDF's own text, or else read from the picture --------------------
  const script = (src) => new Promise((ok, fail) => document.head.append(Object.assign(document.createElement("script"), { src, onload: ok, onerror: fail })));
  let pdfReady, ocrReady;
  const pdfjs = async () => {
    pdfReady ??= script("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(() => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      return pdfjsLib;
    });
    return pdfReady;
  };
  // A phone photo (12 MP or more) is made smaller first: reading it whole can run Safari out of memory.
  const smaller = async (file) => {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, fail) => Object.assign(new Image(), { onload() { ok(this); }, onerror: fail, src: url }));
      // At most 4000 px (12 MP): a bigger picture is more than a phone may draw at once.
      const scale = Math.min(1, 4000 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(img.naturalWidth * scale), height: Math.round(img.naturalHeight * scale) });
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  const ocr = async (image) => {
    ocrReady ??= script("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js").then(() => Tesseract.createWorker("deu").then(async (worker) => {
      // One block of lines, spaces kept: a receipt's name and its price stay on one line.
      await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
      return worker;
    }));
    const worker = await ocrReady;
    return readPaper(image, async (piece) => (await worker.recognize(piece)).data);
  };

  async function readFile(file) {
    if (!/pdf/i.test(file.type) && !/\.pdf$/i.test(file.name)) return ocr(await smaller(file));
    const lib = await pdfjs();
    const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    let text = "";
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      // Text the PDF has itself, line by line (a scan has none, and is read from its picture).
      const content = await page.getTextContent();
      const rows = new Map();
      for (const item of content.items) {
        const y = Math.round(item.transform[5]);
        rows.set(y, [...(rows.get(y) ?? []), item]);
      }
      const own = [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, items]) => items.sort((a, b) => a.transform[4] - b.transform[4]).map((i) => i.str).join(" ")).join("\n");
      if (own.replace(/\s/g, "").length > 30) {
        text += own + "\n";
        continue;
      }
      const viewport = page.getViewport({ scale: 2.5 });
      const canvas = Object.assign(document.createElement("canvas"), { width: viewport.width, height: viewport.height });
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      text += (await ocr(canvas)) + "\n";
    }
    return text;
  }

  /** The receipt's PDF, kept as it is. */
  const keepable = async (file) => ({ bytes: new Uint8Array(await file.arrayBuffer()), type: "application/pdf" });
  const isPdf = (file) => /pdf/i.test(file.type) || /\.pdf$/i.test(file.name);

  async function addFiles(files) {
    const person = me;
    if (!person) {
      $("status").textContent = "velg hvem du er først (AA, AR, RJ eller FR).";
      return;
    }
    let n = 0;
    const unsaved = [];
    // Only PDFs saved on the phone first: nothing is photographed straight into the page.
    const refused = files.filter((f) => !isPdf(f) || f.size > 5_000_000);
    if (refused.length) {
      $("status").textContent = `bare PDF-er på opptil 5 MB kan legges til: ${refused.map((f) => f.name).join(", ")}`;
      return;
    }
    for (const file of files) {
      $("status").textContent = `leser ${file.name} (${++n}/${files.length})…`;
      try {
        const parsed = parseReceipt(await readFile(file));
        // A card slip has only its total: kept, and its alcohol can be set with "alkohol".
        if (!parsed.items.length && !(parsed.total > 0)) throw new Error("fant ingen varer med pris. prøv et skarpere bilde.");
        const id = await store.add({ person, ...parsed, file: file.name, added: new Date().toISOString() });
        // The receipt itself, to look at later: a photo made smaller (still sharp enough to read), a PDF as it is.
        if (store.saveFile) {
          try {
            const kept = await keepable(file);
            await store.saveFile(id, kept.bytes, kept.type);
          } catch (e) {
            unsaved.push(`${file.name} (${e.message ?? e})`);
          }
        }
      } catch (e) {
        $("status").textContent = `kunne ikke lese ${file.name}: ${e.message ?? e} du kan også trykke "+ skriv inn total".`;
        return;
      }
    }
    $("status").textContent =
      `${files.length} kvittering${files.length === 1 ? "" : "er"} lagt til. sjekk at alkoholen (gul, gjennomstreket) stemmer.` +
      (unsaved.length ? ` men selve kvitteringen ble ikke lagret for: ${unsaved.join(", ")}.` : "");
  }
  // A receipt that can't be read (or was lost): its total typed in, and how much of it was alcohol.
  const number = (answer) => (answer === null ? null : Number(answer.trim().replace(/\s/g, "").replace(",", ".")));
  $("typed").addEventListener("click", async () => {
    if (!me) {
      $("status").textContent = "velg hvem du er først (AA, AR, RJ eller FR).";
      return;
    }
    const total = number(prompt("totalen på kvitteringen (f.eks. 23,45)"));
    if (total === null || !Number.isFinite(total)) return;
    const alcohol = number(prompt("hvor mye av det var alkohol? (0 hvis ingenting)", "0"));
    if (alcohol === null || !Number.isFinite(alcohol)) return;
    const shop = prompt("butikk (kan stå tom)", "") ?? "";
    await store.add({
      person: me,
      store: shop.trim() || "skrevet inn",
      date: new Date().toISOString().slice(0, 10),
      items: alcohol ? [{ name: "alkohol (skrevet inn)", amount: alcohol, alcohol: true, typed: true }] : [],
      total,
      typed: true,
      added: new Date().toISOString(),
    });
    $("status").textContent = "kvitteringen er lagt til.";
  });
  $("files").addEventListener("change", () => (addFiles([...$("files").files]), ($("files").value = "")));

  // ---- the receipt itself, over the page ------------------------------------------------------
  async function showReceipt(r) {
    const layer = Object.assign(document.createElement("div"), { className: "viewer" });
    const close = Object.assign(document.createElement("button"), { textContent: "lukk" });
    const what = Object.assign(document.createElement("p"), { className: "muted", textContent: `${r.person} · ${r.store} · henter kvitteringen…` });
    const pages = document.createElement("div");
    layer.append(close, what, pages);
    const onKey = (e) => e.key === "Escape" && shut();
    const shut = () => {
      layer.remove();
      document.body.style.overflow = "";
      removeEventListener("keydown", onKey);
    };
    close.addEventListener("click", shut);
    addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    document.body.append(layer);
    try {
      const bytes = await store.loadFile(r.id, r.attachment.parts);
      what.textContent = `${r.person} · ${r.store}`;
      if (r.attachment.type === "application/pdf") {
        const lib = await pdfjs();
        const pdf = await lib.getDocument({ data: bytes }).promise;
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          // As wide as the screen allows, drawn sharp for the phone's screen.
          const width = Math.min(layer.clientWidth - 32, 900);
          const scale = (width / page.getViewport({ scale: 1 }).width) * (window.devicePixelRatio || 1);
          const viewport = page.getViewport({ scale });
          const canvas = Object.assign(document.createElement("canvas"), { width: viewport.width, height: viewport.height });
          canvas.style.width = `${width}px`;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          pages.append(canvas);
        }
      } else {
        pages.append(Object.assign(document.createElement("img"), { src: URL.createObjectURL(new Blob([bytes], { type: r.attachment.type })), alt: "kvitteringen" }));
      }
    } catch (e) {
      what.textContent = `kunne ikke hente kvitteringen: ${e.message ?? e}`;
    }
  }

  // ---- showing it: who spent what (without alcohol), then each receipt ------------------------
  function render() {
    // The overview: each of the four (and anyone from older receipts), then everyone together.
    const zero = () => ({ counted: 0, alcohol: 0, total: 0, count: 0 });
    const people = new Map(PEOPLE.map((name) => [name, zero()]));
    const all = zero();
    for (const r of receipts) {
      const s = spending(r);
      const p = people.get(r.person) ?? zero();
      for (const t of [p, all]) Object.assign(t, { counted: t.counted + s.counted, alcohol: t.alcohol + s.alcohol, total: t.total + s.total, count: t.count + 1 });
      people.set(r.person, p);
    }
    $("summary").innerHTML = `<tr class="muted"><td>navn</td><td class="num">uten<br>alkohol</td><td class="num">alkohol</td><td class="num">totalt</td><td class="num">kvitt.</td></tr>`;
    for (const [name, p] of [...people, ["alle", all]]) {
      const tr = $("summary").insertRow();
      tr.className = name === "alle" ? "sum line" : "line";
      tr.title = "trykk for å se kvitteringene";
      for (const [value, cls] of [[name, ""], [kr(p.counted), "num ok"], [kr(p.alcohol), "num muted"], [kr(p.total), "num"], [String(p.count), "num muted"]]) Object.assign(tr.insertCell(), { textContent: value, className: cls });
      // A tap on a person shows their receipts.
      tr.addEventListener("click", () => {
        showOnly = name === "alle" ? "" : name;
        $("showReceipts").click();
        render();
      });
    }

    // Evening out: what's not alcohol is shared by the four; alcohol is each one's own.
    const payments = settle(PEOPLE, Object.fromEntries(PEOPLE.map((name) => [name, people.get(name).counted])));
    $("settle").replaceChildren(
      Object.assign(document.createElement("p"), { textContent: `oppgjør: ${kr(all.counted)} delt på ${PEOPLE.length} er ${kr(all.counted / PEOPLE.length)} hver.`, className: "muted" }),
      ...(payments.length
        ? payments.map((p) => Object.assign(document.createElement("p"), { textContent: `${p.from} betaler ${p.to} ${kr(p.amount)}` }))
        : [Object.assign(document.createElement("p"), { textContent: all.count ? "alle har betalt like mye." : "", className: "ok" })]),
    );

    // Whose receipts to show: everyone's, or one person's.
    $("filter").replaceChildren(
      "vis: ",
      ...["alle", ...people.keys()].map((name) => {
        const b = Object.assign(document.createElement("button"), { textContent: name });
        b.classList.toggle("on", (showOnly || "alle") === name);
        b.addEventListener("click", () => ((showOnly = name === "alle" ? "" : name), render()));
        return b;
      }),
    );
    const list = $("list");
    list.replaceChildren();
    const shown = receipts.filter((r) => !showOnly || r.person === showOnly);
    if (showOnly && !shown.length) list.textContent = `${showOnly} har ingen kvitteringer ennå.`;
    for (const r of shown.sort((a, b) => (b.date ?? b.added).localeCompare(a.date ?? a.added))) {
      const s = spending(r);
      const box = document.createElement("div");
      box.className = "receipt";
      const head = document.createElement("div");
      head.textContent = `${r.person} · ${r.date ? r.date.split("-").reverse().join(".") : "uten dato"} · ${r.store}`;
      const totals = document.createElement("div");
      totals.innerHTML = `<span class="ok">${kr(s.counted)}</span> <span class="muted">(totalt ${kr(s.total)}, alkohol ${kr(s.alcohol)})</span>`;
      // A misread number shows as items that don't add up to the total.
      const sum = r.items.reduce((t, i) => t + i.amount, 0);
      if (r.items.length && !r.typed && Math.abs(sum - r.total) > 0.05) totals.innerHTML += `<br><span class="drink" style="text-decoration:none">sjekk: varene blir ${kr(sum)}, ikke ${kr(r.total)}. trykk "endre total" eller slett og skann på nytt.</span>`;
      const table = document.createElement("table");
      r.items.forEach((item, i) => {
        const tr = table.insertRow();
        tr.className = `line${item.alcohol ? " drink" : ""}`;
        tr.title = "trykk for å endre om dette er alkohol";
        Object.assign(tr.insertCell(), { textContent: item.name });
        Object.assign(tr.insertCell(), { textContent: kr(item.amount), className: "num" });
        tr.addEventListener("click", () => store.update({ ...r, items: r.items.map((x, j) => (j === i ? { ...x, alcohol: !x.alcohol } : x)) }));
      });
      const fixTotal = Object.assign(document.createElement("button"), { textContent: "endre total" });
      fixTotal.addEventListener("click", () => {
        const answer = prompt("totalen på kvitteringen (f.eks. 23,45)", String(r.total).replace(".", ","));
        const total = answer && Number(answer.replace(",", "."));
        if (total || total === 0) store.update({ ...r, total });
      });
      const remove = Object.assign(document.createElement("button"), { textContent: "slett" });
      remove.addEventListener("click", () => confirm("slette denne kvitteringen?") && store.remove(r));
      // The alcohol on it, typed in: for a card slip, a handwritten bill, or anything read wrong.
      const fixAlcohol = Object.assign(document.createElement("button"), { textContent: "alkohol" });
      fixAlcohol.addEventListener("click", () => {
        const answer = prompt("hvor mye av denne kvitteringen var alkohol? (f.eks. 12,50)", String(spending(r).alcohol).replace(".", ","));
        const alcohol = answer === null ? NaN : Number(answer.trim().replace(",", "."));
        if (!Number.isFinite(alcohol) || alcohol < 0) return;
        // The items read stay, all counted as not alcohol, and the typed amount is the alcohol.
        const items = r.items.filter((i) => !i.typed).map((i) => ({ ...i, alcohol: false }));
        if (alcohol) items.push({ name: "alkohol (skrevet inn)", amount: alcohol, alcohol: true, typed: true });
        store.update({ ...r, items, typed: true });
      });
      const shown = [head, totals, table, fixTotal, fixAlcohol, remove];
      // The receipt itself, shown over the page (no new window or tab).
      if (r.attachment && store.loadFile) {
        const view = Object.assign(document.createElement("button"), { textContent: "vis kvittering" });
        view.addEventListener("click", () => showReceipt(r));
        shown.splice(3, 0, view);
      }
      box.append(...shown);
      list.append(box);
    }
  }
</script>
</body>
</html>
